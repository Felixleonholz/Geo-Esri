<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rhein-Main Story Map</title>
<link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css">
<style>
  :root{
    --ink:#15202b; --muted:#5d6876; --card:rgba(255,255,255,.94); --line:#e3e0d8;
    --eu:#003399; --gold:#f2b705; --red:#d2453b; --green:#2f8f63; --he:#003399; --rp:#2f8f63; --by:#d2453b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#02040a}
  #map{position:fixed;inset:0;background:radial-gradient(ellipse at center,#0d1b3a 0%,#02040a 70%)}
  #stars{position:fixed;inset:0;pointer-events:none;opacity:1;transition:opacity 2s;
    background-image:radial-gradient(1px 1px at 10% 20%,#fff8,transparent),radial-gradient(1px 1px at 80% 30%,#fff9,transparent),
    radial-gradient(1.5px 1.5px at 30% 80%,#fffa,transparent),radial-gradient(1px 1px at 60% 60%,#fff7,transparent),
    radial-gradient(1px 1px at 90% 85%,#fff9,transparent),radial-gradient(1.5px 1.5px at 45% 10%,#fffb,transparent),
    radial-gradient(1px 1px at 15% 55%,#fff6,transparent),radial-gradient(1px 1px at 70% 95%,#fff8,transparent)}
  #stars.off{opacity:0}

  /* Titel */
  #title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:16vh;text-align:center;color:#fff;pointer-events:none;transition:opacity 1s,transform 1.2s}
  #title.hide{opacity:0;transform:scale(1.15)}
  #title .tag{letter-spacing:.3em;text-transform:uppercase;font-size:13px;color:var(--gold);font-weight:700}
  #title h1{font-size:clamp(34px,6vw,72px);margin:.15em 0;line-height:1.05;text-shadow:0 4px 30px #000}
  #title p{font-size:clamp(15px,2vw,20px);opacity:.85;margin:0}

  /* Karte (Textfeld) */
  #card{position:fixed;left:24px;top:24px;max-height:calc(100vh - 120px);width:min(420px,calc(100vw - 32px));overflow:auto;
    background:#fff;border-radius:16px;padding:26px 26px 22px;box-shadow:0 20px 60px rgba(0,0,0,.35);
    transform:translateX(-120%);transition:transform .7s cubic-bezier(.2,.8,.2,1)}
  #card.show{transform:none}
  #card .num{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--eu)}
  #card h2{font-size:30px;line-height:1.1;margin:6px 0 14px}
  #card .in{opacity:0;transform:translateY(18px);animation:up .6s forwards}
  @keyframes up{to{opacity:1;transform:none}}
  .q{background:#eef2fb;border-left:5px solid var(--eu);padding:14px 16px;font-weight:700;font-size:20px;border-radius:6px}
  .headline{font-family:Georgia,serif;font-size:26px;line-height:1.2;border-top:4px solid var(--ink);border-bottom:1px solid var(--ink);padding:14px 0}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
  .kpi{background:#f3f1ec;border-radius:10px;padding:12px}
  .kpi b{display:block;font-size:28px;line-height:1.1;color:var(--eu)}
  .kpi span{font-size:13px;color:var(--muted)}
  .bar{display:grid;grid-template-columns:120px 1fr 52px;gap:8px;align-items:center;font-size:14px;margin:7px 0}
  .bar i{display:block;height:16px;border-radius:4px;background:var(--eu);width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
  .bar i.r{background:var(--red)} .bar i.g{background:var(--green)}
  .fund{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
  .fund .ico{flex:0 0 46px;height:46px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:13px}
  .fund.no{opacity:.5}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line)}
  th{color:var(--muted)}
  .day{display:inline-block;background:var(--gold);font-weight:800;border-radius:6px;padding:2px 10px;font-size:13px}
  .stop{display:flex;gap:10px;align-items:center;margin:8px 0}
  .stop>b{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px}
  .legend span{display:inline-flex;align-items:center;gap:6px;margin-right:12px;font-size:14px}
  .legend i{width:14px;height:14px;border-radius:3px;display:inline-block}
  .eval>div{border-radius:10px;padding:12px 14px;margin:8px 0}
  .plus{background:#e5f4ec}.minus{background:#fbe8e6}.future{background:#eef2fb}
  .src{font-size:11.5px;color:var(--muted);margin-top:12px;border-top:1px solid var(--line);padding-top:6px}
  .hint{font-size:12px;color:var(--red);font-weight:600;margin-top:10px}
  body.nohints .hint{display:none}
  .muted{color:var(--muted);font-size:14px}

  /* Bilder */
  #photos{position:fixed;right:24px;top:24px;bottom:96px;width:min(360px,30vw);display:flex;flex-direction:column;gap:12px;pointer-events:none}
  .ph{position:relative;flex:1;min-height:0;border-radius:14px;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.4);
      opacity:0;transform:translateX(60px) rotate(2deg);animation:phin .8s cubic-bezier(.2,.8,.2,1) forwards;background:#111}
  .ph img{width:100%;height:100%;object-fit:cover;animation:kb 14s ease-out forwards}
  .ph figcaption{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 9px;color:#fff;font-size:13px;font-weight:600;
      background:linear-gradient(transparent,rgba(0,0,0,.75))}
  .ph.out{animation:phout .4s forwards}
  @keyframes phin{to{opacity:1;transform:none}}
  @keyframes phout{to{opacity:0;transform:translateX(60px)}}
  @keyframes kb{from{transform:scale(1.18) translate(2%,2%)}to{transform:scale(1)}}

  /* Navigation */
  #nav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:16px;padding:8px 10px 8px 12px;background:#0a1223;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  #dots{display:flex;gap:6px;flex-wrap:wrap;max-width:40vw}
  #dots i{width:9px;height:9px;border-radius:50%;background:#fff5;cursor:pointer;transition:.3s}
  #dots i.on{background:var(--gold);transform:scale(1.4)}
  button{font:inherit;cursor:pointer;border:none;border-radius:999px}
  #prev{visibility:hidden;background:#1f2a40;color:#fff;padding:12px 18px}
  #next{background:var(--gold);color:#000;font-weight:800;font-size:18px;padding:14px 34px;box-shadow:0 8px 30px rgba(242,183,5,.45);animation:pulse 2s infinite}
  #next:hover{transform:translateY(-2px)}
  @keyframes pulse{50%{box-shadow:0 8px 40px rgba(242,183,5,.85)}}
  #prog{position:fixed;top:0;left:0;height:4px;background:var(--gold);transition:width .6s;z-index:5}

  /* Kartenmarker */
  .lab{font-weight:800;font-size:13px;color:#fff;background:rgba(10,20,40,.82);padding:4px 9px;border-radius:999px;white-space:nowrap;
       transform:scale(0);animation:pop .5s cubic-bezier(.3,1.6,.5,1) forwards;box-shadow:0 4px 14px rgba(0,0,0,.3)}
  .lab small{font-weight:500;opacity:.8}
  .lab.gold{background:var(--gold);color:#000}
  .lab.red{background:var(--red)}
  .lab.big{font-size:16px;padding:6px 14px}
  @keyframes pop{to{transform:scale(1)}}
  .pin{width:34px;height:34px;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-weight:900;border:3px solid #fff;
       box-shadow:0 0 0 0 rgba(242,183,5,.7);transform:scale(0);animation:pop .5s cubic-bezier(.3,1.6,.5,1) forwards,ring 1.8s 0.6s infinite}
  @keyframes ring{70%{box-shadow:0 0 0 18px rgba(242,183,5,0)}100%{box-shadow:0 0 0 0 rgba(242,183,5,0)}}
  #card,#photos,#nav,#title,#prog{z-index:2}
  .esri-attribution{font-size:10px}
  .esri-attribution__sources::before{content:'Karte: ArcGIS (Esri) · Daten: ';font-weight:700;color:#15202b}
  .circ{border-radius:50%;transform:scale(0);transition:transform .9s cubic-bezier(.3,1.5,.5,1)}
  .circ.on{transform:scale(1)}
  .circ.blue{background:rgba(0,51,153,.32);border:2px solid #003399}
  .circ.gold{background:rgba(242,183,5,.5);border:2px solid #b07f00}
  .circ.dot{background:#fff;border:2px solid #d2453b;transition:none;transform:none}
  .esri-view .esri-view-surface--inset-outline:focus::after{outline:none}

  @media (max-width:900px){
    #card{top:auto;bottom:88px;max-height:48vh;left:12px;width:calc(100vw - 24px);padding:18px}
    #card h2{font-size:23px}
    #photos{left:12px;right:12px;top:12px;bottom:auto;height:20vh;width:auto;flex-direction:row}
    #dots{display:none}
  }
</style>
</head>

];
const DAYC = {1:'#f2b705',2:'#2f8f63',3:'#d2453b'};

/* ---------- Karte: ArcGIS Maps SDK for JavaScript (Esri) ---------- */
let view=null, Graphic=null, PointC=null, ready=false;
const L={};                       // GraphicsLayer je Ebene
let BASEMAP={};
let curBase=null, tripColor='#f2b705';

/* Hilfen */
const fc = f=>({type:'FeatureCollection',features:f});
const line = c=>({type:'Feature',properties:{},geometry:{type:'LineString',coordinates:c}});
function arc(a,b,n=40){ // gebogene Linie
  const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2, dx=b[0]-a[0], dy=b[1]-a[1];
  const cx=mx-dy*0.25, cy=my+dx*0.25, out=[];
  for(let i=0;i<=n;i++){const t=i/n;out.push([(1-t)*(1-t)*a[0]+2*(1-t)*t*cx+t*t*b[0],(1-t)*(1-t)*a[1]+2*(1-t)*t*cy+t*t*b[1]]);}
  return out;
}
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
let anims=[];
function animate(ms,fn,done){const s=performance.now();const o={stop:false};anims.push(o);
  (function f(n){if(o.stop)return;const t=Math.min(1,(n-s)/ms);fn(ease(t),t);if(t<1)requestAnimationFrame(f);else done&&done();})(s);return o;}
let timers=[];const later=(fn,ms)=>timers.push(setTimeout(fn,ms));
function stopAnims(){anims.forEach(a=>a.stop=true);anims=[];timers.forEach(clearTimeout);timers=[];}
const rgba=(hex,a)=>{const n=parseInt(hex.slice(1),16);return [n>>16&255,n>>8&255,n&255,a];};

/* GeoJSON -> ArcGIS-Geometrien (mit Vereinfachung) */
function simplify(pts,tol=0.004){ if(pts.length<5) return pts; const keep=new Uint8Array(pts.length); keep[0]=keep[pts.length-1]=1;
  const st=[[0,pts.length-1]]; while(st.length){ const [a,b]=st.pop(); let md=0,mi=-1; const [x1,y1]=pts[a],[x2,y2]=pts[b],dx=x2-x1,dy=y2-y1,L2=dx*dx+dy*dy||1e-12;
    for(let i=a+1;i<b;i++){ const t=Math.max(0,Math.min(1,((pts[i][0]-x1)*dx+(pts[i][1]-y1)*dy)/L2)); const ex=x1+t*dx-pts[i][0], ey=y1+t*dy-pts[i][1], d=ex*ex+ey*ey; if(d>md){md=d;mi=i;} }
    if(md>tol*tol){ keep[mi]=1; st.push([a,mi],[mi,b]); } }
  return pts.filter((_,i)=>keep[i]); }
function ringCW(r){let s=0;for(let i=0;i<r.length-1;i++)s+=(r[i+1][0]-r[i][0])*(r[i+1][1]+r[i][1]);return s>0?r:[...r].reverse();}
function polyRings(g){const polys=g.type==='Polygon'?[g.coordinates]:g.coordinates;const out=[];
  polys.forEach(p=>p.forEach((r,i)=>{const q=simplify(r); if(q.length>=4) out.push(i===0?ringCW(q):ringCW(q).reverse());}));return out;}
const polygon=g=>({type:'polygon',rings:polyRings(g),spatialReference:{wkid:4326}});
const polyline=paths=>({type:'polyline',paths,spatialReference:{wkid:4326}});
const point=c=>({type:'point',longitude:c[0],latitude:c[1]});
const fillSym=(hex,a,outline)=>({type:'simple-fill',color:rgba(hex,a),outline:outline||{color:[0,0,0,0],width:0}});
const lineSym=(hex,w,a=1)=>({type:'simple-line',color:rgba(hex,a),width:w,cap:'round',join:'round'});
const dotSym=(hex,size,a=.45,stroke)=>({type:'simple-marker',style:'circle',color:rgba(hex,a),size,outline:{color:rgba(stroke||hex,1),width:1.5}});
function setG(layer,list){L[layer].removeAll();L[layer].addMany(list.map(g=>new Graphic(g)));}

/* Ebenen ein-/ausblenden (weich) */
const LAYERMAP={'reg-fill':'regFill','reg-line':'regLine','eu-fill':'eu','eu-line':'eu','flows':'flows'};
function vis(id,on,val){const l=L[LAYERMAP[id]||id];if(!l)return;const from=l.visible?l.opacity:0,to=on?(val??1):0;
  if(on) l.visible=true; animate(600,t=>l.opacity=from+(to-from)*t,()=>{ if(!on) l.visible=false; });}
function base(mode){ if(curBase===mode||!view) return; curBase=mode; view.map.basemap=BASEMAP[mode]; }

/* Kompatibilitäts-Schicht für die Folien (Quellen & Farben) */
const map={
  stop(){},
  getSource(id){return {setData(gj){
    const feats=gj.type==='FeatureCollection'?gj.features:[gj];
    if(id==='dots') setG('dots',feats.map(f=>({geometry:point(f.geometry.coordinates),symbol:dotSym('#ffffff',7,1,'#d2453b')})));
    else if(id==='trip') setG('trip',feats.map(f=>({geometry:polyline(f.geometry.type==='MultiLineString'?f.geometry.coordinates:[f.geometry.coordinates]),symbol:lineSym(tripColor,5)})));
    else if(id==='tripdone') setG('tripdone',feats.map(f=>({geometry:polyline([f.geometry.coordinates]),symbol:lineSym(f.properties.c||'#999',4)})));
    else if(id==='outline') setG('outline',feats.flatMap(f=>{const p=polyline(f.geometry.type==='MultiLineString'?f.geometry.coordinates:[f.geometry.coordinates]);
      return [{geometry:p,symbol:lineSym('#f2b705',11,.35)},{geometry:p,symbol:lineSym('#f2b705',3.5)}];}));
  }};},
  setPaintProperty(id,prop,val){ if(id==='trip'&&prop==='line-color') tripColor=val; if(id==='tripdone'&&prop==='line-opacity'&&L.tripdone) L.tripdone.opacity=val; }
};
let outlineFull=false;
function drawLines(src,lines,ms){
  if(src==='outline') outlineFull=false; let last=0;
  return animate(ms,(t,raw)=>{ const n=performance.now(); if(raw<1&&n-last<50) return; last=n;
    map.getSource(src).setData({type:'Feature',properties:{},geometry:{type:'MultiLineString',
    coordinates:lines.map(l=>l.slice(0,Math.max(2,Math.ceil(l.length*t))))}}); },()=>{ if(src==='outline') outlineFull=true; });
}

/* HTML-Ebene über der ArcGIS-Szene: Beschriftungen, Pins, Kreise, Punkte – ohne Überlappung */
let markers=[]; const overlay=document.createElement('div');
overlay.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden;contain:strict';
let dirty=true, lastCam='', uiRects=[];
const SVGNS='http://www.w3.org/2000/svg', leaders=document.createElementNS(SVGNS,'svg');
leaders.setAttribute('style','position:absolute;inset:0;width:100%;height:100%;overflow:visible');
overlay.appendChild(leaders); const leaderPool=[];
function leader(i){ if(!leaderPool[i]){const l=document.createElementNS(SVGNS,'line');l.setAttribute('stroke','#15202b');l.setAttribute('stroke-width','1.5');l.setAttribute('stroke-opacity','.7');leaders.appendChild(l);leaderPool[i]=l;} return leaderPool[i]; }
function newEl(html,cls,delay){
  const el=document.createElement('div');el.style.cssText='position:absolute;left:0;top:0;will-change:transform,opacity;transition:opacity .25s';
  const inner=document.createElement('div');inner.className=cls;inner.innerHTML=html;inner.style.animationDelay=delay+'ms';
  el.appendChild(inner);overlay.appendChild(el);return el;
}
function mark(lnglat,html,cls='lab',delay=0,anchor='left'){
  const kind=cls.includes('pin')?'pin':(anchor==='center'?'center':'lab');
  const el=newEl(html,cls,delay); const m={lnglat,el,kind,w:0,h:0,prio:markers.length};
  markers.push(m); dirty=true; return m;
}
function circle(lnglat,size,cls,delay=0){
  const el=document.createElement('div');el.className='circ '+cls;el.style.cssText+=`width:${size}px;height:${size}px;transition-delay:${delay}ms`;
  const box=document.createElement('div');box.style.cssText='position:absolute;left:0;top:0;will-change:transform';box.appendChild(el);overlay.appendChild(box);
  const m={lnglat,el:box,kind:'circ',w:size,h:size,inner:el};markers.push(m);dirty=true;
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('on')));return m;
}
function clearMarkers(){markers.forEach(m=>m.el.remove());markers=[];leaderPool.forEach(l=>l.setAttribute('visibility','hidden'));dirty=true;}
function readUI(){ // Flächen von Textkarte, Bildern, Navigation – dort keine Beschriftungen
  uiRects=[]; const add=e=>{const r=e.getBoundingClientRect(); if(r.width>0) uiRects.push({x:r.left-6,y:r.top-6,w:r.width+12,h:r.height+12});};
  const card=document.getElementById('card'); if(card&&card.classList.contains('show')) add(card);
  document.querySelectorAll('#photos .ph:not(.out)').forEach(add); const nav=document.getElementById('nav'); if(nav) add(nav);
  dirty=true;
}
setInterval(readUI,400); addEventListener('resize',readUI);
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function project(m){ const sp=view.toScreen(new PointC({longitude:m.lnglat[0],latitude:m.lnglat[1]})); return (!sp||isNaN(sp.x))?null:sp; }
function layout(){
  if(!view) return;
  const c=view.camera, key=c?`${c.position.x.toFixed(1)},${c.position.y.toFixed(1)},${c.position.z.toFixed(0)},${c.heading.toFixed(2)},${c.tilt.toFixed(2)}`:'';
  if(key===lastCam&&!dirty) return; lastCam=key; dirty=false;
  const W=innerWidth,H=innerHeight, placed=[...uiRects], circs=[], ownR=new Map();
  const free=(b)=>b.x>=4&&b.y>=4&&b.x+b.w<=W-4&&b.y+b.h<=H-4&&!placed.some(p=>hit(b,p));
  let li=0; const line=(x1,y1,x2,y2)=>{const l=leader(li++);l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);l.setAttribute('visibility','visible');};
  // 1) Kreise und Punkte an ihren festen Ort (Kreise sind „weiche“ Hindernisse)
  for(const m of markers){ if(m.kind!=='circ') continue;
    const sp=project(m); if(!sp){m.el.style.opacity=0;continue;}
    m.el.style.opacity=1; m.el.style.transform=`translate(${sp.x-m.w/2}px,${sp.y-m.h/2}px)`;
    if(m.w>12){ circs.push({x:sp.x-m.w/2,y:sp.y-m.h/2,w:m.w,h:m.h,key:m.lnglat.join()}); ownR.set(m.lnglat.join(),Math.max(ownR.get(m.lnglat.join())||0,m.w/2)); }
  }
  // 2) Pins: am Ort, sonst ringförmig daneben mit Linie
  for(const m of markers){ if(m.kind!=='pin'&&m.kind!=='center') continue;
    if(!m.w){m.w=m.el.firstChild.offsetWidth;m.h=m.el.firstChild.offsetHeight;}
    const sp=project(m); if(!sp){m.el.style.opacity=0;continue;}
    const w=m.w,h=m.h; let ok=null;
    const cand=[[0,0]]; for(const R of [w+4,2*w+4]) for(let k=0;k<8;k++){const a=-Math.PI/2+k*Math.PI/4;cand.push([Math.cos(a)*R,Math.sin(a)*R]);}
    for(const [dx,dy] of cand){const bx={x:sp.x+dx-w/2,y:sp.y+dy-h/2,w,h}; if(free(bx)){ok=bx;break;}}
    if(!ok){m.el.style.opacity=0;continue;}
    placed.push({x:ok.x-2,y:ok.y-2,w:w+4,h:h+4}); m.el.style.opacity=1; m.el.style.transform=`translate(${ok.x}px,${ok.y}px)`;
    if(ok.x+w/2!==sp.x||ok.y+h/2!==sp.y){ line(sp.x,sp.y,ok.x+w/2,ok.y+h/2); m.el.style.zIndex=2; }
  }
  // 3) Beschriftungen: kein Überlappen mit Text, Pins, Bildern; Kreise möglichst frei lassen
  for(const m of markers){ if(m.kind!=='lab') continue;
    if(!m.w){m.w=m.el.offsetWidth;m.h=m.el.offsetHeight;}
    const sp=project(m); if(!sp){m.el.style.opacity=0;continue;}
    const w=m.w,h=m.h,key=m.lnglat.join(), r=ownR.get(key)||0;
    const pinHere=markers.some(o=>o!==m&&(o.kind==='pin')&&o.lnglat.join()===key);
    const g=Math.max(12,r+6,pinHere?24:0), cand=[];
    for(const d of [g,g+14,g+32,g+56]) cand.push([sp.x+d,sp.y-h/2],[sp.x-d-w,sp.y-h/2],[sp.x-w/2,sp.y-h-d],[sp.x-w/2,sp.y+d],
      [sp.x+d*.7,sp.y-h-d*.7],[sp.x+d*.7,sp.y+d*.7],[sp.x-d*.7-w,sp.y-h-d*.7],[sp.x-d*.7-w,sp.y+d*.7]);
    let best=null,bestCost=1e9,i=0;
    for(const [x,y] of cand){ const bx={x,y,w,h}; i++; if(!free(bx)) continue;
      let cost=i*40; for(const c of circs){ if(c.key===key) continue; const ix=Math.max(0,Math.min(bx.x+w,c.x+c.w)-Math.max(bx.x,c.x)), iy=Math.max(0,Math.min(bx.y+h,c.y+c.h)-Math.max(bx.y,c.y)); cost+=ix*iy; }
      if(cost<bestCost){bestCost=cost;best=bx;} if(cost<=i*40) break; }
    if(!best){ m.el.style.opacity=0; continue; }
    placed.push({x:best.x-3,y:best.y-3,w:w+6,h:h+6});
    m.el.style.opacity=1; m.el.style.transform=`translate(${best.x}px,${best.y}px)`;
    const ex=Math.max(best.x,Math.min(sp.x,best.x+w)), ey=Math.max(best.y,Math.min(sp.y,best.y+h));
    if(Math.hypot(ex-sp.x,ey-sp.y)>Math.max(16,r+10)) line(sp.x,sp.y,ex,ey);
  }
  for(let i=li;i<leaderPool.length;i++) leaderPool[i].setAttribute('visibility','hidden');
}

let flying=false, flyTok=0, pending=[];
function flush(){ flying=false; const q=pending; pending=[]; q.forEach(f=>f()); dirty=true; }
function fly(center,zoom,opt={}){ if(!view) return; view.padding=pad(); const tok=++flyTok; flying=true;
  view.goTo({center,zoom,tilt:opt.pitch??view.camera.tilt,heading:opt.bearing??0},{duration:opt.duration||2600,easing:'in-out-cubic'})

  };

  setG('regLine',REGION.features.map(f=>({geometry:polygon(f.geometry),symbol:fillSym('#ffffff',0,{color:[255,255,255,.9],width:.8})})));
  setG('flows',FLOWS.features.map(f=>({geometry:polyline([f.geometry.coordinates]),symbol:lineSym('#d2453b',f.properties.w*1.5,.8)})));

/* ---------- Ablauf ---------- */
let cur=-1;
const card=document.getElementById('card'),photos=document.getElementById('photos'),title=document.getElementById('title'),
      stars=document.getElementById('stars'),next=document.getElementById('next'),dots=document.getElementById('dots');
S.forEach((_,i)=>{const d=document.createElement('i');d.title='Folie '+(i+1);d.onclick=()=>go(i);dots.appendChild(d);});

function reset(){
  stopAnims(); clearMarkers(); spinning=false; pending=[]; flying=false;
  ['eu','regFill','regLine','flows'].forEach(k=>{L[k].opacity=0;L[k].visible=false;});
  L.trip.removeAll(); L.tripdone.removeAll(); setTimeout(readUI,900); setTimeout(readUI,3200);
  L.tripdone.opacity=.35; hideCities();
}
function go(i){
  if(i<0||i>=S.length||!ready)return;
  const prev=cur; cur=i; const s=S[i];
  reset();
  title.classList.toggle('hide',!s.title); stars.classList.toggle('off',!(s.title||i===S.length-1));
  // Textkarte
  card.classList.remove('show');
  later(()=>{
    if(s.title){card.innerHTML='';return;}
    card.innerHTML=`<div class="num">${s.num}</div><h2>${s.h}</h2>${s.html}`;
    card.scrollTop=0; card.classList.add('show'); countUp(card); growBars(card);
  }, prev===0?2500:350);
  // Bilder
  [...photos.children].forEach(p=>{p.classList.add('out');setTimeout(()=>p.remove(),400);});
  (s.img||[]).forEach(([f,cap],k)=>later(()=>{
    const fig=document.createElement('figure');fig.className='ph';fig.style.margin=0;fig.style.animationDelay=(k*.25)+'s';
    fig.innerHTML=`<img src="img/${f}.jpg" alt="${cap}"><figcaption>${cap}</figcaption>`;photos.appendChild(fig);
  }, (prev===0?3000:700)));
  flying=true; const tok0=flyTok; s.enter(prev); if(flyTok===tok0) flush();
  next.textContent = i===0?'Start →': i===S.length-1?'Von vorn ↺':'Weiter →';
  document.getElementById('prev').style.visibility=i===0?'hidden':'visible';
  document.getElementById('prog').style.width=(i/(S.length-1)*100)+'%';
  [...dots.children].forEach((d,k)=>d.classList.toggle('on',k===i));
}
next.onclick=()=>go(cur===S.length-1?0:cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();next.click();}
  if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(cur-1);}
  if(e.key==='n'||e.key==='N')document.body.classList.toggle('nohints');
});
</script>
